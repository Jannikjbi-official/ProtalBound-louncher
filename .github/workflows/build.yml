name: Build

# Push a tag like v1.0.0 to build the installers and publish them as a GitHub release.
# Installed launchers pick the release up through electron-updater.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # The section of CHANGELOG.md for this version becomes the release notes
      # (electron-builder reads build/release-notes.md).
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js > build/release-notes.md
        shell: bash

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
        shell: bash
