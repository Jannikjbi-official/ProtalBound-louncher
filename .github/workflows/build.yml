name: Build

# Push a tag like v1.0.0 to build the installers and publish them as a GitHub release.
# Installed launchers pick the release up through electron-updater.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # The section of CHANGELOG.md for this version becomes the release notes
      # (electron-builder reads build/release-notes.md).
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js > build/release-notes.md
        shell: bash

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
        shell: bash

      # Copies without the version in the name, so portalbound.xyz can always link to
      # https://github.com/<repo>/releases/latest/download/<name>.
      - name: Stable download names for the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist
          for pair in \
            "Portalbound-Launcher-setup-$VERSION.exe:Portalbound-Launcher-Setup.exe" \
            "Portalbound-Launcher-setup-$VERSION-arm64.dmg:Portalbound-Launcher-mac-arm64.dmg" \
            "Portalbound-Launcher-setup-$VERSION-x64.dmg:Portalbound-Launcher-mac-x64.dmg" \
            "Portalbound-Launcher-setup-$VERSION.AppImage:Portalbound-Launcher.AppImage"; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              gh release upload "v$VERSION" "$dst" --clobber -R "$GITHUB_REPOSITORY"
            fi
          done
        shell: bash
